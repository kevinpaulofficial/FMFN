name: Hae uutiset

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python skriptit/hae_lahteet.py
      - run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add kaikki.json
          git commit -m "Päivitä uutiset" || echo "Ei muutoksia"
          git push
