<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMFN</title>
<style>
:root{--bg:#fff;--box:#edebeb;--text:#1a1919;--imp:#631515;--who:#b5b5b5;--line:rgba(26,25,25,.15);--pop:#f4f3f3;--accent:#631515;--muted:#5e5a5a;--ok:#1d6b39;--err:#b3261e;--shade:rgba(0,0,0,.72);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
@font-face{font-family:"OpenDyslexic";src:url("OpenDyslexic-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url("OpenDyslexic-Bold.otf") format("opentype");font-weight:700;font-display:swap}
:root[data-dys="1"] body{font-family:"OpenDyslexic",system-ui,sans-serif;line-height:1.7;letter-spacing:.03em;word-spacing:.12em}
:root[data-dys="1"] .card p{display:none}
:root[data-dys="1"] .card{margin-top:26px}
:root[data-dys="1"] .card b{line-height:1.5}
:root[data-dys="1"] .card{letter-spacing:.04em}
:root[data-dys="1"] main h1,:root[data-dys="1"] main h2{font-family:"OpenDyslexic",system-ui,sans-serif;font-size:26px}
:root[data-theme="dark"]{--bg:#161515;--box:#2b2929;--text:#ece9e9;--line:rgba(255,255,255,.18);--pop:#242222;--accent:#e3a3a3;--muted:#a9a3a3;--ok:#7fd29a;--err:#ff8a80;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@font-face{font-family:"theboldfont";src:url("THEBOLDFONT-FREEVERSION.otf") format("opentype"),url("THEBOLDFONT-FREEVERSION.ttf") format("truetype");font-display:swap}
main{width:100%;max-width:600px;margin:0 auto;padding:92px 14px 110px}
#logo{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:15;pointer-events:none}
#logo a{display:block;width:193px;height:79px;color:var(--text);pointer-events:auto;transition:opacity .25s ease,transform .25s ease}
#logo svg{display:block}
#logo .l1{font-size:50px}
#logo .l2{font-size:14px}
#logo text{font-family:"theboldfont",Impact,"Arial Black",sans-serif;font-size:37px;fill:var(--text)}
h1{font-family:"theboldfont",Impact,"Arial Black",sans-serif;font-weight:normal;font-size:32px;margin:8px 0 16px}
#side{display:none}
.sbox{border-radius:14px;padding:6px 14px;margin-bottom:18px}
.shead{font-family:"theboldfont",Impact,"Arial Black",sans-serif;font-weight:normal;font-size:22px;margin:0 0 8px 2px;text-transform:uppercase}
.sbox.simp{background:var(--imp);color:#fff}
.sbox.shot{background:#f7e591;color:#1a1919}
.sbox a{display:block;color:inherit;text-decoration:none;font-size:calc(.85rem + 2px);line-height:1.35;padding:7px 0;border-top:1px solid rgba(127,127,127,.35)}
.sbox a:first-child{border-top:0}
.sbox a:hover{text-decoration:underline}
.sk{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.snone{font-size:.82rem;opacity:.8;margin:4px 0}
:root[data-dys="1"] .shead{font-family:"OpenDyslexic",system-ui,sans-serif;font-size:18px}
.h2a{color:inherit;text-decoration:none}
.h2a:hover{text-decoration:underline}
hr.div{border:0;height:1px;background:var(--line);margin:26px 3px 6px}
h2{font-family:"theboldfont",Impact,"Arial Black",sans-serif;font-weight:normal;font-size:32px;margin:22px 0 8px;opacity:.7;text-transform:uppercase;letter-spacing:.04em}
.card{display:block;position:relative;z-index:1;background:var(--box);color:var(--text);text-decoration:none;border-radius:14px;padding:14px 56px 14px 16px;margin-top:18px}
.card.imp{background:var(--imp);color:#fff}
.card.hot{background:#f7e591;color:#1a1919}
.card{letter-spacing:.02em}
.card b{display:block;font-size:calc(1.02rem + 9px);line-height:1.3}
.card p{margin:3.5px 0 0;font-size:.85rem;line-height:1.4}
.age{position:absolute;top:12px;right:14px;font-size:.78rem;opacity:.75}
.who{background:var(--who);color:#1a1919;border-radius:0 0 12px 12px;padding:14px 12px 8px;margin:-8px 22px 0;font-size:.8rem;position:relative;z-index:0}
.pic{width:100%;aspect-ratio:16/9;border-radius:10px;margin-top:10px;display:flex;align-items:center;justify-content:center;font-size:3rem}
#fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
#ball{width:52px;height:52px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:1.4rem;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#menu{display:none;position:absolute;bottom:62px;left:0;background:var(--bg);border:1px solid var(--box);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:6px;min-width:240px}
#menu.open{display:block}
#menu a{display:block;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:.95rem}
#menu a:hover,#menu a.on{background:var(--box)}
#menu .row{display:flex;align-items:center;gap:6px;padding:4px 12px}
#menu .row span{flex:1;font-size:.95rem}
#menu .row .grip{flex:none;cursor:grab;touch-action:none;padding:6px 8px;font-size:1.1rem;opacity:.6;user-select:none}
#menu .row.drag{position:relative;z-index:30;background:var(--bg);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
#menu .edit{display:block;width:100%;margin-top:6px;padding:10px 12px;border:0;border-top:1px solid var(--box);background:none;text-align:left;font:inherit;font-size:.85rem;opacity:.75;cursor:pointer;color:var(--text)}
@media (min-width:1340px){
#logo{left:calc(50% - 643px);transform:none;top:calc(13px + env(safe-area-inset-top,0px))}
main{padding-top:20px;margin-left:calc(50% - 409px);margin-right:0}
#ball{display:none}
#menu{display:block;position:fixed;right:calc(50% + 413px);left:auto;top:110px;bottom:auto;width:230px;min-width:0;max-height:calc(100vh - 130px);overflow:auto;background:none;border:0;box-shadow:none;padding:0}
#menu a,#menu .edit{font-size:1.05rem}
#side{display:block;position:absolute;left:calc(50% + 195px);top:110px;width:230px}
}
.addcat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--text);color:var(--bg);font:inherit;font-weight:600;cursor:pointer;outline:2px dashed var(--bg);outline-offset:-7px}
.addcat span{font-size:1.4rem;line-height:1}
main .addcat{margin-top:26px}
.sep{margin:26px 6px 8px;border-top:1px solid var(--line)}
#menu .row .x{border:0;background:none;color:var(--text);cursor:pointer;font-size:1rem;padding:6px 8px;opacity:.7}
.empty{opacity:.65;font-size:.9rem;margin:10px 2px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;align-items:center;justify-content:center;padding:16px}
#ov.open{display:flex}
#dlg{position:relative;background:var(--pop);color:var(--text);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px;padding:18px}
#dlg h3{margin:4px 0 12px;font-size:1.25rem}
#dlg input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--box);color:var(--text);font:inherit;font-size:1rem}
.wstep,.whint{font-size:.8rem;opacity:.65}
.wstep{padding-right:40px}
.whint{margin:6px 2px}
.wsrc{margin-bottom:10px}
.wst{display:block;font-size:.78rem;min-height:1em;margin:3px 2px 0}
.wst.ok{color:#1c7c3a}
.wsug{background:var(--pop);border:1px solid var(--line);border-radius:10px;margin-top:2px;overflow:hidden}
.wsug:empty{display:none}
.wsug button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;color:var(--text);font:inherit;cursor:pointer}
.wsug button:hover{background:var(--box)}
.wsug small{opacity:.6;margin-left:8px}
.wbtn{padding:11px 16px;border-radius:10px;border:1px solid var(--text);background:var(--pop);color:var(--text);font:inherit;cursor:pointer}
.wbtn.p{background:var(--text);color:var(--pop)}
.wbtn.red{background:#c62828;border-color:#c62828;color:#fff}
.wrow{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.wrow.end{justify-content:flex-end}
.wor{text-align:center;margin:18px 0 10px;font-size:.85rem;letter-spacing:.08em;opacity:.7}
.waiwrap{text-align:center}
.waiwrap[hidden],.waip[hidden]{display:none}
.waip{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px}
.waip textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--box);color:var(--text);font:inherit;font-size:.85rem;resize:vertical}
.waip .wrow{margin-top:8px;align-items:center}
.waist{font-size:.8rem;opacity:.75}
.waisteps{margin:0 0 10px;padding-left:22px;color:var(--accent);font-size:.88rem;line-height:1.7}
.waip .wrow.cprow{margin:12px 0}
.waip textarea.hid{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.wkw .wtag{display:block;margin:0 0 4px 2px}
#dlg.big{max-width:760px;max-height:100%}
#dlg h4{margin:22px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.wsrc{position:relative}
.wrs{position:absolute;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--text);cursor:pointer;opacity:.7}
.wrs:hover{background:var(--pop);opacity:1}
.catedit{margin:-6px 0 6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:.85rem;cursor:pointer}
.wx{position:absolute;z-index:5;top:10px;right:10px;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:none;color:var(--text);font-size:1.1rem;line-height:1;cursor:pointer;opacity:.7}
.wx *{pointer-events:none}
.wx:hover{background:var(--box);opacity:1}
.wchip{display:inline-flex;align-items:center;gap:6px;background:var(--box);border-radius:999px;padding:5px 6px 5px 12px;margin:4px 4px 0 0;font-size:.88rem}
.wchip.v{font-size:.78rem;opacity:.7;padding:3px 4px 3px 9px}
.wchip button{border:0;background:none;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0 4px}
.wkw{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px}
.wtag{font-size:.65rem;opacity:.6;text-transform:uppercase;letter-spacing:.04em}
/* onboarding + category creation (scoped to #obOv) */
#obOv{--display:"theboldfont",Impact,"Arial Black",sans-serif;position:fixed;inset:0;z-index:60;background:var(--shade);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#obOv[hidden]{display:none}
:root[data-dys="1"] #obOv{--display:"OpenDyslexic",system-ui,sans-serif}
#obSheet{position:relative;background:var(--pop);color:var(--text);border-radius:20px;width:100%;height:100%;max-width:1120px;display:flex;flex-direction:column;overflow:hidden}
#obOv button,#obOv input,#obOv textarea{font:inherit;color:inherit}
#obOv :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#obOv [hidden]{display:none}
#obOv .x{position:absolute;z-index:5;top:12px;right:12px;width:42px;height:42px;border:0;border-radius:50%;background:none;cursor:pointer;font-size:1.15rem;display:flex;align-items:center;justify-content:center;opacity:.75}
#obOv .x *{pointer-events:none}
#obOv .x:hover{background:var(--box);opacity:1}
#obOv .welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;gap:18px;overflow:auto;container-type:inline-size}
#obOv .wlogo{display:block;width:193px;max-width:100%;margin:0;color:var(--text)}
#obOv .wlogo text{font-family:"theboldfont",Impact,"Arial Black",sans-serif;fill:currentColor}
#obOv .welcome h1{font-family:var(--display);font-weight:normal;font-size:12.24cqi;line-height:1;margin:0;white-space:nowrap}
:root[data-dys="1"] #obOv .welcome h1{font-size:15.6cqi}
#obOv .welcome p{margin:0;max-width:100%;font-size:1.1rem;line-height:1.6;color:var(--muted)}
#obOv .go{margin-top:12px;width:50%;min-width:200px;padding:18px 24px;border:0;border-radius:14px;background:var(--text);color:var(--pop);font-size:1.1rem;font-weight:600;cursor:pointer}
#obOv .choice{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr)}
#obOv .choice .div{background:var(--line);margin:56px 0}
#obOv .opt{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:40px 28px;margin:16px;border:0;border-radius:18px;background:none;cursor:pointer;text-align:center;min-width:0;container-type:inline-size}
#obOv .opt:hover{background:var(--box)}
/* sama koko molemmille: pidempi otsikko mahtuu yhdelle riville */
#obOv .opt .t{font-family:var(--display);font-size:min(2.4rem,calc(100cqi / 13.3));line-height:1.05;text-transform:uppercase;white-space:nowrap}
:root[data-dys="1"] #obOv .opt .t{text-transform:none;font-size:min(2rem,calc(100cqi / 10.6))}
#obOv .opt p{margin:0;max-width:30ch;min-height:3em;color:var(--muted)}
#obOv .pill{margin-top:6px;padding:12px 26px;border-radius:12px;background:var(--text);color:var(--pop);font-weight:600}
#obOv .chead{padding:18px 64px 14px 24px;border-bottom:1px solid var(--line)}
#obOv .chead h3{margin:0;font-size:1.3rem}
#obOv .cbody{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 230px}
#obOv .form{overflow:auto;padding:18px 24px 24px;min-width:0}
#obOv .done{border-left:1px solid var(--line);padding:18px;overflow:auto}
#obOv .done h4,#obOv .sec h4{margin:0 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
#obOv .done ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
#obOv .done li{display:flex;gap:8px;align-items:baseline;font-size:.95rem}
#obOv .done li::before{content:"✓";color:var(--ok);font-weight:700}
#obOv .done li.none{font-size:.85rem;color:var(--muted)}
#obOv .done li.none::before{content:none}
#obOv .done li.new{animation:obpop .6s ease}
@keyframes obpop{from{background:var(--box)}to{background:transparent}}
#obOv .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
#obOv .tile{aspect-ratio:1/1;max-width:100%;min-width:0;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--bg);cursor:pointer;position:relative}
#obOv .tile:hover{border-color:var(--text)}
#obOv .tile .tn{font-family:var(--display);font-size:1.35rem;line-height:1.05;text-transform:uppercase;overflow-wrap:break-word;hyphens:auto;padding-right:20px;max-width:100%}
#obOv .tile .tn.long{font-size:1.02rem}
:root[data-dys="1"] #obOv .tile .tn{text-transform:none;font-size:1.05rem}
#obOv .tile .tm{font-size:.78rem;color:var(--muted)}
#obOv .tile .ck{position:absolute;top:10px;right:12px;font-weight:700}
#obOv .tile[aria-pressed="true"]{background:var(--text);color:var(--pop);border-color:var(--text)}
#obOv .tile[aria-pressed="true"] .tm{color:inherit;opacity:.8}
#obOv .tile.made{border-style:dashed;cursor:default;opacity:.6}
#obOv .tile.made .ck{color:var(--ok)}
#obOv .sec{margin-top:22px}
#obOv .sec:first-child{margin-top:0}
#obOv .sec.bad h4{color:var(--err)}
#obOv .sec.bad .in{border-color:var(--err);box-shadow:0 0 0 1px var(--err)}
#obOv .ferr{color:var(--err);font-size:.8rem;margin:6px 2px 0}
#obOv .in{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--box)}
#obOv .hint{font-size:.8rem;color:var(--muted);margin:6px 2px 0}
#obOv .field{position:relative}
#obOv .sug{position:absolute;left:0;right:0;top:100%;z-index:4;background:var(--pop);border:1px solid var(--line);border-radius:10px;margin-top:2px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#obOv .sug:empty{display:none}
#obOv .sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;padding:10px 12px;border:0;background:none;cursor:pointer}
#obOv .sug button:hover,#obOv .sug button:focus-visible{background:var(--box)}
#obOv .sug small{color:var(--muted);white-space:nowrap}
#obOv .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#obOv .chip{display:inline-flex;align-items:center;gap:4px;background:var(--box);border-radius:999px;padding:4px 4px 4px 12px;font-size:.88rem;max-width:100%}
#obOv .chip.v{font-size:.8rem;padding:2px 2px 2px 10px;color:var(--muted)}
#obOv .chip button{border:0;background:none;cursor:pointer;width:26px;height:26px;border-radius:50%;line-height:1}
#obOv .chip button:hover{background:var(--line)}
#obOv .kw{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
#obOv .kw .lbl{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
#obOv .kw .chips{margin-top:4px}
#obOv .or{text-align:center;margin:18px 0 10px;font-size:.85rem;letter-spacing:.08em;color:var(--muted)}
#obOv .center{text-align:center}
#obOv .btn{padding:11px 16px;border-radius:10px;border:1px solid var(--text);background:var(--pop);cursor:pointer}
#obOv .btn.p{background:var(--text);color:var(--pop)}
#obOv .tl{background:none;border:0;padding:8px 4px;cursor:pointer;color:var(--text);text-decoration:underline;text-underline-offset:3px}
#obOv .aip{padding:12px;border:1px solid var(--line);border-radius:12px}
#obOv .aip ol{margin:0 0 10px;padding-left:22px;color:var(--accent);font-size:.88rem;line-height:1.7}
#obOv .aip textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--box);resize:vertical}
#obOv .aip .row{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:12px 0}
#obOv .aip .row:last-child{margin-bottom:0}
#obOv .aip .st{margin-right:auto;font-size:.8rem;color:var(--muted)}
#obOv .cfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:10px;padding:14px 24px;border-top:1px solid var(--line)}
#obOv .cfoot .msg{margin-right:auto;font-size:.88rem;min-width:0}
#obOv .cfoot .msg.ok{color:var(--ok)}
#obOv .cfoot .msg.err{color:var(--err)}
#obOv .confirm{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;padding:12px 24px;background:var(--box)}
#obOv .confirm span{margin-right:auto}
@media (max-width:760px){
 #obOv .choice{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) 1px minmax(0,1fr)}
 #obOv .choice .div{margin:0 24px}
 #obOv .opt{margin:8px;padding:20px}
 #obOv .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
 #obOv .cbody{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
 #obOv .done{order:-1;border-left:0;border-bottom:1px solid var(--line);padding:10px 16px}
 #obOv .done ul{flex-direction:row;flex-wrap:wrap;gap:4px 14px}
 #obOv .done h4{display:inline;margin-right:8px}
 #obOv .chead{padding-left:16px}
 #obOv .form,#obOv .cfoot,#obOv .confirm{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){#obOv .done li.new{animation:none}}
/* first-category button on the home page */
.obig{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;width:100%;min-height:150px;margin-top:20px;border:0;border-radius:18px;background:var(--text);color:var(--bg);cursor:pointer;outline:2px dashed var(--bg);outline-offset:-9px;padding:24px;font:inherit}
.obig span{font-size:1.25rem;font-weight:600}
.obig small{opacity:.8;font-size:.85rem}
</style>
</head>

'<button class="tl" id="toReady">Lisää valmiit kategoriat</button><button class="btn" id="cNext">Tallenna ja lisää</button><button class="btn p" id="cDone">Valmis</button>'),"Luo oma kategoria");
drawForm();drawDone();$("fName").focus();
$("sClose").onclick=function(){tryLeave(closeOv)};$("toReady").onclick=function(){tryLeave(openReady)};
$("cNext").onclick=function(){if(commit())reset()};$("cDone").onclick=function(){if(isEmpty()){closeOv();return}if(commit())closeOv()}}
function drawForm(){$("obForm").innerHTML='<div class="sec" id="secName"><h4><label for="fName">Nimi</label></h4><input class="in" id="fName" maxlength="30" placeholder="Esim. Tekoäly" value="'+esc(F.name)+'" aria-describedby="errName"><p class="ferr" id="errName" hidden></p></div>'+
'<div class="sec" id="secSrc"><h4><label for="fSrc">Lähteet</label></h4><div class="field"><input class="in" id="fSrc" autocomplete="off" placeholder="Hae lähdettä, esim. Yle tai BBC" aria-describedby="errSrc"><div class="sug" id="srcSug"></div></div><p class="ferr" id="errSrc" hidden></p><p class="hint">Kirjoita lähteen nimi tai liitä sivuston osoite.</p><div class="chips" id="srcChips"></div></div>'+
'<div class="sec"><h4><label for="fKw">Hakusanat</label></h4><div class="field"><input class="in" id="fKw" autocomplete="off" placeholder="Kirjoita aihe tai tarkka hakusana"><div class="sug" id="kwSug"></div></div><p class="hint">Kirjoita esim. jalkapallo ja napauta sopivaa aihetta. Pilkku tai Enter lisää tarkan hakusanan. Ilman hakusanoja näytetään kaikki valittujen lähteiden uutiset.</p><div id="kwList"></div>'+
'<div class="or">– TAI –</div><div class="center" id="aiWrap"><button class="btn" id="aiOpen">✨ Luo hakusanat tekoälyllä</button></div><div class="aip" id="aiPanel" hidden><ol><li>Kopioi prompti ja liitä se omaan tekoälyysi.</li><li>Vastaa tekoälyn kysymyksiin.</li><li>Kopioi tekoälyn antamat hakusanat ja liitä ne alla olevaan kenttään.</li></ol><textarea id="aiPrompt" hidden readonly></textarea><div class="row"><span class="st" id="cpSt" role="status"></span><button class="btn" id="aiCopy">Kopioi prompti</button></div><textarea id="aiIn" rows="3" placeholder="Liitä tekoälyn vastaus tähän"></textarea><div class="row"><span class="st" id="aiSt" role="status"></span><button class="btn p" id="aiAdd">Lisää hakusanat</button></div></div></div>';
drawSrc();drawKw()}
function drawSrc(){$("srcChips").innerHTML=F.src.map(function(s,i){return '<span class="chip">'+esc(s.n)+'<button data-ors="'+i+'" aria-label="Poista '+esc(s.n)+'">✕</button></span>'}).join('')}
function drawKw(){var h="",ex=[];F.kws.forEach(function(k,i){if(!k.t){ex.push(i);return}
h+='<div class="kw"><span class="lbl">Aihe</span><span class="chip"><b>'+esc(k.k)+'</b><button data-ork="'+i+'" aria-label="Poista aihe">✕</button></span><div class="chips">'+k.v.map(function(v,j){return '<span class="chip v">'+esc(v)+'<button data-orv="'+i+'-'+j+'" aria-label="Poista '+esc(v)+'">✕</button></span>'}).join('')+'</div></div>'});
if(ex.length)h+='<div class="kw"><span class="lbl">Tarkat hakusanat</span><div class="chips">'+ex.map(function(i){return '<span class="chip">'+esc(F.kws[i].k)+'<button data-ork="'+i+'" aria-label="Poista '+esc(F.kws[i].k)+'">✕</button></span>'}).join('')+'</div></div>';
$("kwList").innerHTML=h}
function setErr(k,t){var s=$("sec"+k),e=$("err"+k);if(!s)return;s.classList.toggle("bad",!!t);e.textContent=t;e.hidden=!t}
function addSrc(s){if(F.src.some(function(x){return (s.id&&x.id===s.id)||x.n.toLowerCase()===s.n.toLowerCase()}))return;F.src.push(s);F.touched=true;setErr("Src","");drawSrc()}
function addTopic(id){var x=getTop(id);if(!x||F.kws.some(function(k){return k.id===id}))return;F.kws.push({k:x.nimi,id:x.id,t:true,v:x.sanat.slice()});F.touched=true;drawKw()}
function addWord(w){w=w.trim().toLowerCase();if(!w||F.kws.some(function(k){return !k.t&&k.k===w}))return;F.kws.push({k:w,t:false,v:[]});F.touched=true;drawKw()}
function isEmpty(){return !F.name.trim()&&!F.src.length&&!F.kws.length}
function commit(){var nm=F.name.trim(),en="",es="";
if(!nm)en="*Kategorialta puuttuu nimi.";else if(exists(nm))en="*Sinulla on jo kategoria nimeltä "+nm+".";
if(!F.src.length)es="*Lisää vähintään yksi lähde.";
setErr("Name",en);setErr("Src",es);
if(en||es){msg("Täydennä punaisella merkityt kohdat.","err");(en?$("fName"):$("fSrc")).focus();return false}
saveCat({name:nm,src:F.src.slice(),kws:JSON.parse(JSON.stringify(F.kws))});JUSTN=[nm];drawDone();return true}
function reset(){var nm=JUSTN[0];F=blank();drawForm();$("obForm").scrollTop=0;msg("✓ "+nm+" tallennettu. Lisää seuraava kategoria.","ok");$("fName").focus()}
function tryLeave(fn){if(isEmpty()||!F.touched){fn();return}ask("Hylätäänkö keskeneräinen kategoria?","Jatka muokkausta","Hylkää",fn)}

/* tekoälyprompti */
function aiPrompt(){var n=F.name.trim();return (n?'Kategoriani nimi on "'+n+'".\n\n':'')+'Autat minua tekemään hakusanoja uutisten suodattamiseen. Kysy minulta yksi kysymys kerrallaan ja odota vastaus ennen seuraavaa:\n1) Mikä on kategorian aihe?\n2) Mitkä asiat aiheessa kiinnostavat erityisesti (esim. henkilöt, joukkueet, yritykset, tapahtumat)?\n3) Haluatko hakusanat suomeksi, englanniksi vai molemmilla?\n\nTee vastausten perusteella 15–40 hakusanaa. Säännöt:\n- sanat perusmuodossa, ei taivutusmuotoja\n- vähintään 3 kirjainta, nimet ja lyhenteet käyvät\n- ei toistoja\n\nKirjoita lopuksi yksi lyhyt rivi (esim. "Tässä hakusanat:") ja sen alle kaikki hakusanat yhteen koodilohkoon (```) yhdellä rivillä pilkuilla eroteltuna, jotta voin kopioida ne yhdellä napilla. Älä kirjoita koodilohkon jälkeen mitään.'}

/* tapahtumat ikkunan sisällä */
document.addEventListener("input",function(e){if(!F||!e.target.closest("#obOv"))return;var t=e.target;
if(t.id==="fName"){F.name=t.value;F.touched=true;if(t.value.trim())setErr("Name","")}
if(t.id==="fSrc"){var q=t.value.trim(),h="";if(q){var r=rx(q.toLowerCase());
WCAT.filter(function(x){return r.test(x.nimi)||x.id.indexOf(q.toLowerCase())===0}).slice(0,6).forEach(function(x){h+='<button data-osrc="'+esc(x.id)+'"><span>'+esc(x.nimi)+'</span><small>'+(x.kieli==="fi"?"Suomi":"EN")+'</small></button>'});
if(/^(https?:\/\/)?[\w-]+(\.[\w-]+)+/i.test(q))h+='<button data-ourl="'+esc(q)+'"><span>Lisää oma osoite: '+esc(q)+'</span><small>oma</small></button>'}$("srcSug").innerHTML=h}
if(t.id==="fKw"){var v=t.value;if(v.indexOf(",")>-1){v.split(",").forEach(addWord);t.value="";$("kwSug").innerHTML="";return}
var q2=v.trim(),h2="";if(q2.length>=2){var r2=rx(q2);var a=WTOP.filter(function(x){return r2.test(x.nimi)||r2.test(x.paa)}),b=WTOP.filter(function(x){return a.indexOf(x)<0&&x.sanat.some(function(w){return r2.test(w)})});
a.concat(b).slice(0,7).forEach(function(x){h2+='<button data-otop="'+esc(x.id)+'"><span><b>'+esc(x.nimi)+'</b></span><small>'+esc(x.paa)+' · '+x.sanat.length+' sanaa</small></button>'})}
if(q2)h2+='<button data-oword="'+esc(q2)+'"><span>Lisää tarkka hakusana: <b>'+esc(q2)+'</b></span><small>tarkka</small></button>';$("kwSug").innerHTML=h2}});
document.addEventListener("keydown",function(e){if($("obOv").hidden)return;
if(e.key==="Escape"){var sug=$("obOv").querySelector(".sug:not(:empty)");if(sug){sug.innerHTML="";return}escHandler();return}
if(e.key==="Enter"&&e.target.id==="fKw"){e.preventDefault();addWord(e.target.value);e.target.value="";$("kwSug").innerHTML=""}
if(e.key==="Enter"&&e.target.id==="fSrc"){e.preventDefault();var first=$("srcSug").querySelector("button");if(first)first.click()}});
document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest("#obOv"))return;
var tb=e.target.closest("[data-tile]");
if(tb&&VIEW==="ready"){var ti=+tb.dataset.tile;if(exists(PACKS[ti].nimi))return;var at=SEL.indexOf(ti);if(at>-1)SEL.splice(at,1);else SEL.push(ti);
drawGrid();$("obGrid").querySelector('[data-tile="'+ti+'"]').focus();msg(SEL.length?SEL.length+" valittu.":"","");return}
if(!F)return;var b=e.target.closest("button");
if(!b){if(!e.target.closest(".field"))$("obOv").querySelectorAll(".sug").forEach(function(s){s.innerHTML=""});return}var d=b.dataset;
if(d.osrc!==undefined){var x=getSrc(d.osrc);if(x)addSrc({n:x.nimi,id:x.id});$("fSrc").value="";$("srcSug").innerHTML="";$("fSrc").focus();return}
if(d.ourl!==undefined){addSrc({n:d.ourl.replace(/^https?:\/\//,""),id:"",url:d.ourl});$("fSrc").value="";$("srcSug").innerHTML="";return}
if(d.otop!==undefined){addTopic(d.otop);$("fKw").value="";$("kwSug").innerHTML="";$("fKw").focus();return}
if(d.oword!==undefined){addWord(d.oword);$("fKw").value="";$("kwSug").innerHTML="";$("fKw").focus();return}
if(d.ors!==undefined){F.src.splice(+d.ors,1);drawSrc();return}
if(d.ork!==undefined){F.kws.splice(+d.ork,1);drawKw();return}
if(d.orv!==undefined){var p=d.orv.split("-");F.kws[+p[0]].v.splice(+p[1],1);drawKw();return}
if(b.id==="aiOpen"){$("aiWrap").hidden=true;$("aiPanel").hidden=false;$("aiCopy").focus();return}
if(b.id==="aiCopy"){var pt=aiPrompt(),st=$("cpSt"),ta=$("aiPrompt");ta.value=pt;
var fb=function(){ta.hidden=false;ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(err){}st.textContent=ok?"Kopioitu!":"Kopioi prompti kentästä.";if(ok)ta.hidden=true};
try{navigator.clipboard.writeText(pt).then(function(){st.textContent="Kopioitu!"},fb)}catch(err){fb()}return}
if(b.id==="aiAdd"){var ws=wParseAI($("aiIn").value),b4=F.kws.length;ws.forEach(function(w){w=w.toLowerCase();if(!F.kws.some(function(k){return !k.t&&k.k===w}))F.kws.push({k:w,t:false,v:[]})});var n=F.kws.length-b4;
if(n){F.touched=true;drawKw();$("aiIn").value=""}$("aiSt").textContent=ws.length?"Lisättiin "+n+" hakusanaa.":"Hakusanoja ei löytynyt. Liitä pilkuilla eroteltu lista.";return}});

window.obLoad=function(){return fetch("valmiit.json").then(function(r){return r.ok?r.json():null}).then(function(j){PACKS=(j&&j.valmiit)||[]}).catch(function(){})};
window.obOpenChoice=openChoice;
window.obStart=function(){if(!ORDER.length&&!welcomed())openWelcome()};
})();

window.addEventListener('scroll',fade,{passive:true});var lastW=window.innerWidth;window.addEventListener('resize',function(){fade();if(window.innerWidth!==lastW){lastW=window.innerWidth;placeSide()}});if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){placeSide()});fade();
