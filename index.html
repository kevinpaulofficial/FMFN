function srcList(q){q=(q||"").trim();var r=q?rx(q.toLowerCase()):null;
return WCAT.filter(function(x){return (!r||r.test(x.nimi)||x.id.indexOf(q.toLowerCase())===0)}).slice().sort(function(a,b){return a.nimi.localeCompare(b.nimi,"fi")})}
function showSrc(){var f=$("fSrc");if(!f)return;var q=f.value.trim(),L=srcList(q),h="";
L.forEach(function(x){var on=F.src.some(function(s){return s.id===x.id});h+='<button role="option" data-osrc="'+esc(x.id)+'" aria-selected="'+on+'"><span>'+esc(x.nimi)+'</span><small>'+(x.kieli==="fi"?"FIN":"ENG")+'</small></button>'});
if(q&&/^(https?:\/\/)?[\w-]+(\.[\w-]+)+/i.test(q))h+='<button role="option" data-ourl="'+esc(q)+'"><span>Add your own address: '+esc(q)+'</span><small>custom</small></button>';
if(!h)h='<div class="none">No sources match this search.</div>';$("srcSug").innerHTML=h;f.setAttribute("aria-expanded","true");var a=$("srcToggle");if(a){a.setAttribute("aria-expanded","true");a.setAttribute("aria-label","Hide sources")}}
function hideSrc(){var s=$("srcSug");if(s)s.innerHTML="";var f=$("fSrc");if(f)f.setAttribute("aria-expanded","false");var a=$("srcToggle");if(a){a.setAttribute("aria-expanded","false");a.setAttribute("aria-label","Show all sources")}}
function setErr(k,t){var s=$("sec"+k),e=$("err"+k);if(!s)return;s.classList.toggle("bad",!!t);e.textContent=t;e.hidden=!t}
function addSrc(s){if(F.src.some(function(x){return (s.id&&x.id===s.id)||x.n.toLowerCase()===s.n.toLowerCase()}))return;F.src.push(s);F.touched=true;setErr("Src","");drawSrc()}
function addTopic(id){var x=getTop(id);if(!x||F.kws.some(function(k){return k.id===id}))return;F.kws.push({k:x.nimi,id:x.id,t:true,v:x.sanat.slice()});F.touched=true;drawKw()}
function addWord(w){w=w.trim().toLowerCase();if(!w||F.kws.some(function(k){return !k.t&&k.k===w}))return;F.kws.push({k:w,t:false,v:[]});F.touched=true;drawKw()}
function isEmpty(){return !F.name.trim()&&!F.src.length&&!F.kws.length}
function commit(){var nm=F.name.trim(),en="",es="";
if(!nm)en="*The category needs a name.";else if(exists(nm,F.edit))en="*You already have a category called "+nm+".";
if(!F.src.length)es="*Add at least one source.";
setErr("Name",en);setErr("Src",es);
if(en||es){msg("Fill in the fields marked in red.","err");(en?$("fName"):$("fSrc")).focus();return false}
var nc={name:nm,src:F.src.slice(),kws:JSON.parse(JSON.stringify(F.kws))};if(F.edit&&CUSTOM[F.edit]){saveCat(nc,F.edit);return true}saveCat(nc);JUSTN=[nm];drawDone();return true}
function reset(){var nm=JUSTN[0];F=blank();drawForm();$("obForm").scrollTop=0;msg("✓ "+nm+" saved. Add the next category.","ok");softFocus($("fName"))}
function tryLeave(fn){if(isEmpty()||!F.touched){fn();return}ask("Discard the unfinished category?","Keep editing","Discard",fn)}

/* tekoälyprompti */
function aiPrompt(){var n=F.name.trim();return (n?'My category is called "'+n+'".\n\n':'')+'You are helping me create keywords for filtering news. Ask me one question at a time and wait for my answer before asking the next one:\n1) What is the topic of the category?\n2) What in the topic interests you most (e.g. people, teams, companies, events)?\n3) Do you want the keywords in Finnish, English or both?\n\nBased on the answers, create 15–40 keywords. Rules:\n- words in their base form, no inflected forms\n- if a Finnish word inflects irregularly (e.g. mies → miehen, vesi → veden), add its inflection stem in parentheses after it, several stems separated by a slash, at least 4 letters each: mies (miehe), vesi (vede/vett). Do not add parentheses to words that inflect regularly\n- at least 3 letters; names and abbreviations are fine\n- no duplicates\n\nFinally, write one short line (e.g. "Here are the keywords:") and below it all the keywords in a single code block (```) on one line, separated by commas, so I can copy them with one click. Do not write anything after the code block.'}

/* tapahtumat ikkunan sisällä */
document.addEventListener("input",function(e){if(!F||!e.target.closest("#obOv"))return;var t=e.target;
if(t.id==="fName"){F.name=t.value;F.touched=true;if(t.value.trim())setErr("Name","")}
if(t.id==="fSrc")showSrc();

var q2=v.trim(),h2="";if(q2.length>=2){var r2=rx(q2);var a=WTOP.filter(function(x){return r2.test(x.nimi)||r2.test(x.paa)}),b=WTOP.filter(function(x){return a.indexOf(x)<0&&x.sanat.some(function(w){return r2.test(w)})});
a.concat(b).slice(0,7).forEach(function(x){h2+='<button data-otop="'+esc(x.id)+'"><span><b>'+esc(x.nimi)+'</b></span><small>'+esc(x.paa)+' · '+x.sanat.length+' words</small></button>'})}
if(q2)h2+='<button data-oword="'+esc(q2)+'"><span>Add exact keyword: <b>'+esc(q2)+'</b></span><small>exact</small></button>';$("kwSug").innerHTML=h2}});
document.addEventListener("focusin",function(e){if(!F||$("obOv").hidden)return;if(e.target.id==="fSrc"){showSrc();return}if(!e.target.closest("#secSrc"))hideSrc()});
document.addEventListener("keydown",function(e){if($("obOv").hidden)return;
if(F&&(e.key==="ArrowDown"||e.key==="ArrowUp")&&e.target.closest("#secSrc .field")){var o=[].slice.call($("srcSug").querySelectorAll("button"));if(!o.length){if(e.target.id==="fSrc"&&e.key==="ArrowDown")showSrc();o=[].slice.call($("srcSug").querySelectorAll("button"));if(!o.length)return}
e.preventDefault();var k=o.indexOf(document.activeElement);if(e.key==="ArrowDown")(o[k+1]||o[0]).focus();else if(k<=0)$("fSrc").focus();else o[k-1].focus();return}
if(e.key==="Escape"&&$("kOv")){$("obConfirm").innerHTML="";return}
if(e.key==="Escape"){var sug=$("obOv").querySelector(".sug:not(:empty)");if(sug){if(sug.id==="srcSug"){hideSrc();$("fSrc").focus()}else sug.innerHTML="";return}escHandler();return}
if(e.key==="Enter"&&e.target.id==="fKw"){e.preventDefault();addWord(e.target.value);e.target.value="";$("kwSug").innerHTML=""}
if(e.key==="Enter"&&e.target.id==="fSrc"){e.preventDefault();var first=$("srcSug").querySelector("button");if(first)first.click()}});
document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest("#obOv"))return;
var gx=e.target.closest("[data-gexp]");
if(gx&&VIEW==="ready"){toggleGroup(gx);return}
var gt=e.target.closest("[data-group]");
if(gt&&VIEW==="ready"){var gi=+gt.dataset.group,av=groupAvail(groupList()[gi]);if(!av.length)return;
var all=av.every(function(i){return SEL.indexOf(i)>-1});if(all)SEL=SEL.filter(function(i){return av.indexOf(i)<0});else av.forEach(function(i){if(SEL.indexOf(i)<0)SEL.push(i)});
drawGrid();$("obGrid").querySelector('[data-group="'+gi+'"]').focus();msg(SEL.length?SEL.length+" selected.":"","");return}
var tb=e.target.closest("[data-tile]");
if(tb&&VIEW==="ready"){var ti=+tb.dataset.tile;if(exists(PACKS[ti].nimi))return;var at=SEL.indexOf(ti);if(at>-1)SEL.splice(at,1);else SEL.push(ti);
drawGrid();$("obGrid").querySelector('[data-tile="'+ti+'"]').focus();msg(SEL.length?SEL.length+" selected.":"","");return}
if(!F)return;var b=e.target.closest("button");
if(!b){if(!e.target.closest(".field")){$("obOv").querySelectorAll(".sug").forEach(function(s){s.innerHTML=""});hideSrc()}return}var d=b.dataset;
if(b.id==="srcToggle"){if($("srcSug").innerHTML){hideSrc()}else{$("fSrc").value="";showSrc();$("srcSug").scrollTop=0}return}
if(d.osrc!==undefined){var x=getSrc(d.osrc);if(x){var at=F.src.findIndex(function(s){return s.id===x.id});if(at>-1){F.src.splice(at,1);drawSrc()}else addSrc({n:x.nimi,id:x.id})}
showSrc();var again=$("srcSug").querySelector('[data-osrc="'+d.osrc+'"]');if(again)again.focus();return}
if(d.olang!==undefined){var other=d.olang==="fi"?"en":"fi";if(LANG[d.olang]&&!LANG[other])return;LANG[d.olang]=!LANG[d.olang];
$("obOv").querySelectorAll("[data-olang]").forEach(function(l){l.setAttribute("aria-pressed",LANG[l.dataset.olang])});if($("srcSug").innerHTML)showSrc();return}
if(d.ourl!==undefined){addSrc({n:d.ourl.replace(/^https?:\/\//,""),id:"",url:d.ourl});$("fSrc").value="";hideSrc();$("fSrc").focus();return}
if(d.otop!==undefined){addTopic(d.otop);$("fKw").value="";$("kwSug").innerHTML="";$("fKw").focus();return}
if(d.oword!==undefined){addWord(d.oword);$("fKw").value="";$("kwSug").innerHTML="";$("fKw").focus();return}
if(d.ors!==undefined){F.src.splice(+d.ors,1);drawSrc();if($("srcSug").innerHTML)showSrc();return}
if(d.ork!==undefined){F.kws.splice(+d.ork,1);drawKw();return}
if(d.orv!==undefined){var p=d.orv.split("-");F.kws[+p[0]].v.splice(+p[1],1);drawKw();return}
if(b.id==="aiOpen"){$("aiWrap").hidden=true;$("aiPanel").hidden=false;$("aiCopy").focus();return}
if(b.id==="aiCopy"){var pt=aiPrompt(),st=$("cpSt"),ta=$("aiPrompt");ta.value=pt;
var fb=function(){ta.hidden=false;ta.focus();ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(err){}st.textContent=ok?"Copied!":"Copy the prompt from the field.";if(ok)ta.hidden=true};
try{navigator.clipboard.writeText(pt).then(function(){st.textContent="Copied!"},fb)}catch(err){fb()}return}
if(b.id==="aiAdd"){var ws=wParseAIv($("aiIn").value),b4=F.kws.length;ws.forEach(function(o){var w=o.w.toLowerCase(),ex=F.kws.filter(function(k){return !k.t&&k.k===w})[0];if(ex){ex.v=ex.v||[];o.v.forEach(function(x){if(ex.v.indexOf(x)<0)ex.v.push(x)})}else F.kws.push({k:w,t:false,v:o.v})});var n=F.kws.length-b4;
if(n){F.touched=true;drawKw();$("aiIn").value=""}$("aiSt").textContent=ws.length?"Added "+n+" keywords.":"No keywords found. Paste a comma-separated list.";return}});
