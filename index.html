<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Uutiset</title>
<style>
:root{--bg:#fff;--box:#edebeb;--text:#1a1919;--imp:#631515;--who:#b5b5b5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:1.3rem;margin:8px 0 16px}
h2{font-size:.95rem;margin:22px 0 8px;opacity:.7;text-transform:uppercase;letter-spacing:.04em}
.card{display:block;position:relative;z-index:1;background:var(--box);color:var(--text);text-decoration:none;border-radius:14px;padding:14px 56px 14px 16px;margin-top:10px}
.card.imp{background:var(--imp);color:#fff}
.card b{display:block;font-size:calc(1.02rem + 2px);line-height:1.3}
.card p{margin:6px 0 0;font-size:.85rem;line-height:1.4}
.age{position:absolute;top:12px;right:14px;font-size:.78rem;opacity:.75}
.who{background:var(--who);color:var(--text);border-radius:0 0 12px 12px;padding:14px 12px 8px;margin:-8px 22px 0;font-size:.8rem;position:relative;z-index:0}
.pic{height:140px;border-radius:10px;margin-top:10px;display:flex;align-items:center;justify-content:center;font-size:3rem}
#fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
#ball{width:52px;height:52px;border-radius:50%;border:0;background:var(--text);color:#fff;font-size:1.4rem;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#menu{display:none;position:absolute;bottom:62px;left:0;background:#fff;border:1px solid var(--box);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:6px;min-width:190px}
#menu.open{display:block}
#menu a{display:block;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:.95rem}
#menu a:hover,#menu a.on{background:var(--box)}
</style>
</head>
<body>
<main id="app"></main>
<div id="fab"><div id="menu"></div><button id="ball" aria-label="Valikko">☰</button></div>
<script>
var H=3600000,D=86400000,T=Date.UTC(2026,10,15,8,0,0);
var CATS={suomi:"Suomen uutiset",jalkapallo:"Jalkapallo",teknologia:"Teknologia",maailma:"Maailman uutiset",musiikki:"Musiikki"};
var DATA={};
function two(t){var m=(t||"").match(/[^.!?]+[.!?]+/g);return m?m.slice(0,2).join(" ").trim():(t||"")}
function load(){return fetch("news.json?"+Date.now()).then(function(r){return r.json()}).then(function(j){Object.keys(CATS).forEach(function(k){DATA[k]=(j[k]||[]).map(function(x){return{t:x.title,s:two(x.description),u:x.link,p:Date.parse(x.published)||Date.now(),imp:false,who:"",img:x.image}})})})}
function age(p){var s=Math.max(0,Math.floor((Date.now()-p)/1000));
if(s<60)return s+"s";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d"}
var ICON={suomi:"🇫🇮",jalkapallo:"⚽",teknologia:"💻",maailma:"🌍",musiikki:"🎵"};
function pic(n,k){if(n.img)return '<img class="pic" src="'+n.img+'" alt="" style="width:100%;object-fit:cover" onerror="this.style.display=\'none\'">';var h=0;for(var i=0;i<n.t.length;i++)h=(h+n.t.charCodeAt(i))%360;return '<div class="pic" style="background:linear-gradient(135deg,hsl('+h+',35%,60%),hsl('+((h+40)%360)+',35%,38%))">'+ICON[k]+'</div>'}
function card(n,k){return '<a class="card'+(n.imp?' imp':'')+'" href="'+n.u+'" target="_blank" rel="noopener"><span class="age">'+age(n.p)+'</span><b>'+n.t+'</b><p>'+n.s+'</p>'+pic(n,k)+'</a>'+(n.who?'<div class="who">'+n.who+'</div>':'')}
function home(){var h='<h1>Koti</h1>';
Object.keys(CATS).forEach(function(k){var a=DATA[k].slice().sort(function(x,y){return y.p-x.p});
var imp=a.filter(function(n){return n.imp})[0];if(!imp)imp=a[1];var last=a.filter(function(n){return n!==imp})[0];
h+='<h2>'+CATS[k]+'</h2>'+(imp?card(imp,k):'')+(last?card(last,k):'')});return h}
function cat(k){return '<h1>'+CATS[k]+'</h1>'+DATA[k].slice().sort(function(x,y){return y.p-x.p}).map(function(n){return card(n,k)}).join('')}
function route(){var k=(location.hash||"#koti").slice(1);
document.getElementById('app').innerHTML=CATS[k]?cat(k):home();
document.getElementById('menu').innerHTML='<a href="#koti" class="'+(!CATS[k]?'on':'')+'">Koti</a>'+Object.keys(CATS).map(function(c){return '<a href="#'+c+'" class="'+(c===k?'on':'')+'">'+CATS[c]+'</a>'}).join('');
document.getElementById('menu').classList.remove('open');window.scrollTo(0,0)}
document.getElementById('ball').onclick=function(){document.getElementById('menu').classList.toggle('open')};
window.addEventListener('hashchange',route);load().then(route).catch(function(){document.getElementById('app').textContent='Uutisten lataus epäonnistui.'});
</script>
</body>
</html>
