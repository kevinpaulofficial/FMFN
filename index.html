<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FMFN</title>
<style>
:root{--bg:#fff;--box:#edebeb;--text:#1a1919;--imp:#631515;--who:#b5b5b5;--line:rgba(26,25,25,.15);--pop:#f4f3f3;--accent:#631515;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
@font-face{font-family:"OpenDyslexic";src:url("OpenDyslexic-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"OpenDyslexic";src:url("OpenDyslexic-Bold.otf") format("opentype");font-weight:700;font-display:swap}
:root[data-dys="1"] body{font-family:"OpenDyslexic",system-ui,sans-serif;line-height:1.7;letter-spacing:.03em;word-spacing:.12em}
:root[data-dys="1"] .card p{display:none}
:root[data-dys="1"] .card{margin-top:26px}
:root[data-dys="1"] .card b{line-height:1.5}
:root[data-dys="1"] .card{letter-spacing:.04em}
:root[data-dys="1"] main h1,:root[data-dys="1"] main h2{font-family:"OpenDyslexic",system-ui,sans-serif;font-size:26px}
:root[data-theme="dark"]{--bg:#161515;--box:#2b2929;--text:#ece9e9;--line:rgba(255,255,255,.18);--pop:#242222;--accent:#e3a3a3;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@font-face{font-family:"theboldfont";src:url("THEBOLDFONT-FREEVERSION.otf") format("opentype"),url("THEBOLDFONT-FREEVERSION.ttf") format("truetype");font-display:swap}
main{width:100%;max-width:600px;margin:0 auto;padding:92px 14px 110px}
#logo{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:15;pointer-events:none}
#logo a{display:block;width:193px;height:79px;color:var(--text);pointer-events:auto;transition:opacity .25s ease,transform .25s ease}
#logo svg{display:block}
#logo .l1{font-size:50px}
#logo .l2{font-size:14px}
#logo text{font-family:"theboldfont",Impact,"Arial Black",sans-serif;font-size:37px;fill:var(--text)}
h1{font-family:"theboldfont",Impact,"Arial Black",sans-serif;font-weight:normal;font-size:32px;margin:8px 0 16px}
#side{display:none}
.sbox{border-radius:14px;padding:6px 14px;margin-bottom:18px}
.shead{font-family:"theboldfont",Impact,"Arial Black",sans-serif;font-weight:normal;font-size:22px;margin:0 0 8px 2px;text-transform:uppercase}
.sbox.simp{background:var(--imp);color:#fff}
.sbox.shot{background:#f7e591;color:#1a1919}
.sbox a{display:block;color:inherit;text-decoration:none;font-size:calc(.85rem + 2px);line-height:1.35;padding:7px 0;border-top:1px solid rgba(127,127,127,.35)}
.sbox a:first-child{border-top:0}
.sbox a:hover{text-decoration:underline}
.sk{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;opacity:.8}
.snone{font-size:.82rem;opacity:.8;margin:4px 0}
:root[data-dys="1"] .shead{font-family:"OpenDyslexic",system-ui,sans-serif;font-size:18px}
.h2a{color:inherit;text-decoration:none}
.h2a:hover{text-decoration:underline}
hr.div{border:0;height:1px;background:var(--line);margin:26px 3px 6px}
h2{font-family:"theboldfont",Impact,"Arial Black",sans-serif;font-weight:normal;font-size:32px;margin:22px 0 8px;opacity:.7;text-transform:uppercase;letter-spacing:.04em}
.card{display:block;position:relative;z-index:1;background:var(--box);color:var(--text);text-decoration:none;border-radius:14px;padding:14px 56px 14px 16px;margin-top:18px}
.card.imp{background:var(--imp);color:#fff}
.card.hot{background:#f7e591;color:#1a1919}
.card{letter-spacing:.02em}
.card b{display:block;font-size:calc(1.02rem + 9px);line-height:1.3}
.card p{margin:3.5px 0 0;font-size:.85rem;line-height:1.4}
.age{position:absolute;top:12px;right:14px;font-size:.78rem;opacity:.75}
.who{background:var(--who);color:#1a1919;border-radius:0 0 12px 12px;padding:14px 12px 8px;margin:-8px 22px 0;font-size:.8rem;position:relative;z-index:0}
.pic{width:100%;aspect-ratio:16/9;border-radius:10px;margin-top:10px;display:flex;align-items:center;justify-content:center;font-size:3rem}
#fab{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20}
#ball{width:52px;height:52px;border-radius:50%;border:0;background:var(--text);color:var(--bg);font-size:1.4rem;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.3)}
#menu{display:none;position:absolute;bottom:62px;left:0;background:var(--bg);border:1px solid var(--box);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.2);padding:6px;min-width:240px}
#menu.open{display:block}
#menu a{display:block;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-size:.95rem}
#menu a:hover,#menu a.on{background:var(--box)}
#menu .row{display:flex;align-items:center;gap:6px;padding:4px 12px}
#menu .row span{flex:1;font-size:.95rem}
#menu .row .grip{flex:none;cursor:grab;touch-action:none;padding:6px 8px;font-size:1.1rem;opacity:.6;user-select:none}
#menu .row.drag{position:relative;z-index:30;background:var(--bg);border-radius:10px;box-shadow:0 8px 22px rgba(0,0,0,.28)}
#menu .edit{display:block;width:100%;margin-top:6px;padding:10px 12px;border:0;border-top:1px solid var(--box);background:none;text-align:left;font:inherit;font-size:.85rem;opacity:.75;cursor:pointer;color:var(--text)}
@media (min-width:1340px){
#logo{left:calc(50% - 643px);transform:none;top:calc(13px + env(safe-area-inset-top,0px))}
main{padding-top:20px;margin-left:calc(50% - 409px);margin-right:0}
#ball{display:none}
#menu{display:block;position:fixed;right:calc(50% + 413px);left:auto;top:110px;bottom:auto;width:230px;min-width:0;max-height:calc(100vh - 130px);overflow:auto;background:none;border:0;box-shadow:none;padding:0}
#menu a,#menu .edit{font-size:1.05rem}
#side{display:block;position:absolute;left:calc(50% + 195px);top:110px;width:230px}
}
.addcat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:14px;border:0;border-radius:14px;background:var(--text);color:var(--bg);font:inherit;font-weight:600;cursor:pointer;outline:2px dashed var(--bg);outline-offset:-7px}
.addcat span{font-size:1.4rem;line-height:1}
main .addcat{margin-top:26px}
.sep{margin:26px 6px 8px;border-top:1px solid var(--line)}
#menu .row .x{border:0;background:none;color:var(--text);cursor:pointer;font-size:1rem;padding:6px 8px;opacity:.7}
.empty{opacity:.65;font-size:.9rem;margin:10px 2px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;align-items:center;justify-content:center;padding:16px}
#ov.open{display:flex}
#dlg{position:relative;background:var(--pop);color:var(--text);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:18px;padding:18px}
#dlg h3{margin:4px 0 12px;font-size:1.25rem}
#dlg input{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--box);color:var(--text);font:inherit;font-size:1rem}
.wstep,.whint{font-size:.8rem;opacity:.65}
.wstep{padding-right:40px}
.whint{margin:6px 2px}
.wsrc{margin-bottom:10px}
.wst{display:block;font-size:.78rem;min-height:1em;margin:3px 2px 0}
.wst.ok{color:#1c7c3a}
.wsug{background:var(--pop);border:1px solid var(--line);border-radius:10px;margin-top:2px;overflow:hidden}
.wsug:empty{display:none}
.wsug button{display:block;width:100%;text-align:left;padding:10px 12px;border:0;background:none;color:var(--text);font:inherit;cursor:pointer}
.wsug button:hover{background:var(--box)}
.wsug small{opacity:.6;margin-left:8px}
.wbtn{padding:11px 16px;border-radius:10px;border:1px solid var(--text);background:var(--pop);color:var(--text);font:inherit;cursor:pointer}
.wbtn.p{background:var(--text);color:var(--pop)}
.wbtn.red{background:#c62828;border-color:#c62828;color:#fff}
.wrow{display:flex;justify-content:space-between;gap:8px;margin-top:18px}
.wrow.end{justify-content:flex-end}
.wor{text-align:center;margin:18px 0 10px;font-size:.85rem;letter-spacing:.08em;opacity:.7}
.waiwrap{text-align:center}
.waiwrap[hidden],.waip[hidden]{display:none}
.waip{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:12px}
.waip textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--box);color:var(--text);font:inherit;font-size:.85rem;resize:vertical}
.waip .wrow{margin-top:8px;align-items:center}
.waist{font-size:.8rem;opacity:.75}
.waisteps{margin:0 0 10px;padding-left:22px;color:var(--accent);font-size:.88rem;line-height:1.7}
.waip .wrow.cprow{margin:12px 0}
.waip textarea.hid{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.wkw .wtag{display:block;margin:0 0 4px 2px}
#dlg.big{max-width:760px;max-height:100%}
#dlg h4{margin:22px 0 8px;font-size:.8rem;text-transform:uppercase;letter-spacing:.04em;opacity:.7}
.wsrc{position:relative}
.wrs{position:absolute;top:6px;right:6px;width:34px;height:34px;border:0;border-radius:8px;background:none;color:var(--text);cursor:pointer;opacity:.7}
.wrs:hover{background:var(--pop);opacity:1}
.catedit{margin:-6px 0 6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--text);font:inherit;font-size:.85rem;cursor:pointer}
.wx{position:absolute;z-index:5;top:10px;right:10px;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:none;color:var(--text);font-size:1.1rem;line-height:1;cursor:pointer;opacity:.7}
.wx *{pointer-events:none}
.wx:hover{background:var(--box);opacity:1}
.wchip{display:inline-flex;align-items:center;gap:6px;background:var(--box);border-radius:999px;padding:5px 6px 5px 12px;margin:4px 4px 0 0;font-size:.88rem}
.wchip.v{font-size:.78rem;opacity:.7;padding:3px 4px 3px 9px}
.wchip button{border:0;background:none;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0 4px}
.wkw{margin-top:12px;padding:10px;border:1px solid var(--line);border-radius:12px}
.wtag{font-size:.65rem;opacity:.6;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<div id="logo"><a href="#koti" aria-label="FMFN – FilterMyF*cka*sNews, kotisivu"><svg viewBox="0 0 193 79" width="193" height="79" aria-hidden="true"><text class="l1" x="96.5" y="47" text-anchor="middle" textLength="179" lengthAdjust="spacingAndGlyphs">FMFN</text><text class="l2" x="96.5" y="69" text-anchor="middle" textLength="179" lengthAdjust="spacingAndGlyphs">FilterMyF*cka*sNews</text></svg></a></div>
<main id="app"></main>
<aside id="side" aria-label="Tärkeimmät ja puhutuimmat"></aside>
<div id="ov"><div id="dlg"></div></div>
<input type="file" id="impfile" accept="application/json,.json" hidden>
<div id="fab"><div id="menu"></div><button id="ball" aria-label="Valikko">☰</button></div>
<script>
var THEME="light";try{THEME=localStorage.getItem("theme")==="dark"?"dark":"light"}catch(e){}
function setTheme(t){THEME=t;document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("theme",t)}catch(e){}}
setTheme(THEME);
var DYS=false;try{DYS=localStorage.getItem("dys")==="1"}catch(e){}
function setDys(v){DYS=v;document.documentElement.setAttribute("data-dys",v?"1":"0");try{localStorage.setItem("dys",v?"1":"0")}catch(e){}}
setDys(DYS);
var H=3600000,D=86400000,T=Date.UTC(2026,10,15,8,0,0);
var CATS={suomi:"Suomen uutiset",jalkapallo:"Jalkapallo",teknologia:"Teknologia",maailma:"Maailman uutiset",musiikki:"Musiikki"};
var DATA={};
function two(t){var m=(t||"").match(/[^.!?]+[.!?]+/g);return m?m.slice(0,2).join(" ").trim():(t||"")}
function loadNews(){return fetch("news.json?"+Date.now()).then(function(r){return r.json()}).then(function(j){Object.keys(CATS).forEach(function(k){DATA[k]=(j[k]||[]).map(function(x){return{t:x.title,s:two(x.description),u:x.link,p:Date.parse(x.published)||Date.now(),imp:!!x.important,hot:!!x.hot,who:"",img:x.image}})})})}
var ALL=[],WCAT=[];
function loadAll(){return fetch("kaikki.json?"+Date.now()).then(function(r){return r.ok?r.json():null}).then(function(j){if(!j)return;var hp=Date.parse(j.haettu)||Date.now();ALL=(j.uutiset||[]).map(function(x){return{t:x.t,s:two(x.s),u:x.u,p:Date.parse(x.p)||hp,img:x.i,l:x.l,imp:false,hot:false,who:""}})}).catch(function(){})}
function loadCat(){return fetch("lahteet.json").then(function(r){return r.ok?r.json():null}).then(function(j){if(j)WCAT=j.lahteet||[]}).catch(function(){})}
function load(){return Promise.all([loadNews(),loadAll(),loadCat()])}
function age(p){var s=Math.max(0,Math.floor((Date.now()-p)/1000));
if(s<60)return s+"s";if(s<3600)return Math.floor(s/60)+"m";if(s<86400)return Math.floor(s/3600)+"h";return Math.floor(s/86400)+"d"}
function pic(n,k){return n.img?'<img class="pic" src="'+wesc(n.img)+'" alt="" style="width:100%;object-fit:cover" onerror="this.remove()">':''}
function safeUrl(u){return /^https?:\/\//i.test(u||"")?u:"#"}
function card(n,k,hot){return '<a class="card'+(n.imp?' imp':(hot&&n.hot?' hot':''))+'" href="'+wesc(safeUrl(n.u))+'" target="_blank" rel="noopener"><span class="age">'+age(n.p)+'</span><b>'+wesc(n.t)+'</b><p>'+wesc(n.s)+'</p>'+pic(n,k)+'</a>'+(n.who?'<div class="who">'+wesc(n.who)+'</div>':'')}
// sama uutinen tunnistetaan linkistä (ilman ?-osaa) tai samasta otsikosta
function nkey(n){return (n.t||"").toLowerCase().replace(/[^\p{L}\p{N}]+/gu," ").trim()}
function nurl(n){return (n.u||"").split(/[?#]/)[0]}
function Seen(){var su={},st={};return{has:function(n){var u=nurl(n),t=nkey(n);return !!((u&&su[u])||(t&&st[t]))},add:function(n){var u=nurl(n),t=nkey(n);if(u)su[u]=1;if(t)st[t]=1}}}
// poistaa toistot; tärkeä ja puhuttu versio säilyy ensisijaisesti
function prep(a){var S=Seen();return (a||[]).slice().sort(function(x,y){return (y.imp-x.imp)||(y.hot-x.hot)||(y.p-x.p)}).filter(function(n){if(S.has(n))return false;S.add(n);return true}).sort(function(x,y){return y.p-x.p})}
function home(){var h='',S=Seen();
ORDER.forEach(function(k,i){var a=prep(DATA[k]).filter(function(n){return !S.has(n)});
var imp=a.filter(function(n){return n.imp})[0];if(!imp)imp=a[1];var last=a.filter(function(n){return n!==imp})[0];
if(imp)S.add(imp);if(last)S.add(last);
h+=(i?'<hr class="div">':'')+'<h2><a class="h2a" href="#'+k+'">'+wesc(CATS[k])+'</a></h2>'+(imp?card(imp,k):'')+(last?card(last,k):'')+(a.length?'':'<p class="empty">Ei osumia nykyisillä uutisilla.</p>')});return h+'<button class="addcat" data-addcat="1"><span>+</span> Lisää kategoria</button>'}
function tops(k){var a=prep(DATA[k]),imp=a.filter(function(n){return n.imp})[0];return{a:a,imp:imp,hot:a.filter(function(n){return n.hot&&n!==imp}).slice(0,2)}}
function cat(k){var T=tops(k),a=T.a,top=(T.imp?[T.imp]:[]).concat(T.hot);
var rest=a.filter(function(n){return top.indexOf(n)<0});
return '<h1>'+wesc(CATS[k])+'</h1>'+(CUSTOM[k]?'<button class="catedit" data-editcat="'+k+'">✎ Muokkaa kategoriaa</button>':'')+top.concat(rest).map(function(n){return card(n,k,top.indexOf(n)>-1)}).join('')+(a.length?'':'<p class="empty">Ei osumia nykyisillä uutisilla.</p>')}
function sideItem(k,n){return '<a href="'+wesc(safeUrl(n.u))+'" target="_blank" rel="noopener"><span class="sk">'+wesc(CATS[k])+'</span> | '+wesc(n.t)+'</a>'}
// enintään 3 uutista: ensin yksi kustakin kategoriasta järjestyksessä, sitten lisää samoista kategorioista
function fillSide(S,get){var out=[],L=ORDER.map(function(k){return{k:k,c:get(k)}});
L.forEach(function(l){if(out.length>=3)return;for(var i=0;i<l.c.length;i++){if(!S.has(l.c[i])){S.add(l.c[i]);out.push({k:l.k,n:l.c[i]});return}}});
L.forEach(function(l){l.c.forEach(function(n){if(out.length<3&&!S.has(n)){S.add(n);out.push({k:l.k,n:n})}})});return out}
function side(){var S=Seen();
var I=fillSide(S,function(k){return prep(DATA[k]).filter(function(n){return n.imp})});
var P=fillSide(S,function(k){return prep(DATA[k]).filter(function(n){return n.hot&&!n.imp})});
var box=function(cls,L,none){return '<div class="sbox '+cls+'">'+(L.length?L.map(function(x){return sideItem(x.k,x.n)}).join(''):'<p class="snone">'+none+'</p>')+'</div>'};
return '<h3 class="shead">Tärkeimmät</h3>'+box('simp',I,'Ei tärkeitä uutisia juuri nyt.')+'<h3 class="shead">Puhutuimmat</h3>'+box('shot',P,'Ei puhuttuja uutisia juuri nyt.')}
function placeSide(){var sd=document.getElementById('side');if(!WIDE.matches){sd.style.top='';return}
var c=document.querySelector('#app .card'),b=sd.querySelector('.sbox');if(!c||!b)return;
var top=Math.max(10,Math.round(c.getBoundingClientRect().top+window.scrollY-b.offsetTop));sd.style.top=top+'px'}
var CUSTOM={},DEL=[];try{CUSTOM=JSON.parse(localStorage.getItem("custom")||"{}");DEL=JSON.parse(localStorage.getItem("del")||"[]")}catch(e){}
Object.keys(CUSTOM).forEach(function(id){CATS[id]=CUSTOM[id].name});
var ORDER=Object.keys(CATS),EDIT=false;
try{var sv=JSON.parse(localStorage.getItem("order")||"[]");if(Array.isArray(sv)){var ok=sv.filter(function(c){return CATS[c]});Object.keys(CATS).forEach(function(c){if(ok.indexOf(c)<0)ok.push(c)});ORDER=ok}}catch(e){}
ORDER=ORDER.filter(function(c){return DEL.indexOf(c)<0});
function save(){try{localStorage.setItem("order",JSON.stringify(ORDER))}catch(e){}}
var DRAFT=null,drag=null;
function menu(k){var h='<a href="#koti" class="'+(!CATS[k]?'on':'')+'">Koti</a>';
(EDIT?DRAFT:ORDER).forEach(function(c){h+=EDIT?'<div class="row" data-c="'+c+'"><span class="grip" aria-label="Vedä siirtääksesi">⠿</span><span>'+CATS[c]+'</span>'+(CUSTOM[c]?'<button class="x" data-editcat="'+c+'" aria-label="Muokkaa kategoriaa">✎</button>':'')+'<button class="x" data-del="'+c+'" aria-label="Poista kategoria">✕</button></div>':'<a href="#'+c+'" class="'+(c===k?'on':'')+'">'+CATS[c]+'</a>'});
return h+'<button class="addcat" data-addcat="1"><span>+</span> Lisää kategoria</button><button class="edit" id="editbtn">'+(EDIT?'Valmis':'Muokkaa järjestystä')+'</button><div class="sep"></div><button class="edit" id="themebtn">'+(THEME==="dark"?"Vaalea teema":"Tumma teema")+'</button><button class="edit" id="dysbtn">'+(DYS?"Lukihäiriötila: päällä":"Lukihäiriötila: pois")+'</button><div class="sep"></div><button class="edit" id="exportbtn">Vie asetukset</button><button class="edit" id="importbtn">Tuo asetukset</button>'}
function route(keep){var k=(location.hash||"#koti").slice(1);
document.getElementById('app').innerHTML=CATS[k]&&ORDER.indexOf(k)>-1?cat(k):home();
document.getElementById('menu').innerHTML=menu(k);
document.getElementById('side').innerHTML=side();placeSide();
if(keep===true)return;
document.getElementById('menu').classList.remove('open');window.scrollTo(0,0)}
var M=document.getElementById('menu');
M.addEventListener('click',function(e){if(e.target.id==="exportbtn"){exportSettings();return}if(e.target.id==="importbtn"){document.getElementById("impfile").click();return}if(e.target.id==="dysbtn"){setDys(!DYS);route(true);return}if(e.target.id==="themebtn"){setTheme(THEME==="dark"?"light":"dark");route(true);return}if(e.target.id!=="editbtn")return;
if(EDIT){ORDER=DRAFT.slice();save();EDIT=false}else{DRAFT=ORDER.slice();EDIT=true}route(true)});
var grab=0;
M.addEventListener('pointerdown',function(e){var g=e.target.closest&&e.target.closest('.grip');if(!g)return;drag=g.parentNode;grab=e.clientY-drag.getBoundingClientRect().top;drag.classList.add('drag');g.setPointerCapture(e.pointerId);e.preventDefault()});
M.addEventListener('pointermove',function(e){if(!drag)return;
drag.style.transform='';var top=e.clientY-grab,center=top+drag.offsetHeight/2;

function validSettings(o){if(!o||typeof o!=="object"||!o.asetukset||typeof o.asetukset!=="object")return null;var a=o.asetukset,out={};
try{if(a.theme==="light"||a.theme==="dark")out.theme=a.theme;if(a.dys==="1"||a.dys==="0")out.dys=a.dys;

if(a.del!==undefined){var y=JSON.parse(a.del);if(Array.isArray(y)&&y.every(function(v){return typeof v==="string"}))out.del=a.del}
if(a.custom!==undefined){var c=JSON.parse(a.custom);if(c&&typeof c==="object"&&!Array.isArray(c)&&Object.keys(c).every(function(k){return c[k]&&typeof c[k].name==="string"&&Array.isArray(c[k].kws)}))out.custom=a.custom}}catch(e){return null}
return Object.keys(out).length?out:null}
